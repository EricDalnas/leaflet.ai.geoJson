<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet.AI.GeoJSON &mdash; Live Demo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
    integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="dist/leaflet.ai.geojson.css" />
  <script src="dist/leaflet.ai.geojson.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #map{width:100%;height:100vh}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10000}
    .dialog{background:#fff;border-radius:8px;padding:26px 28px;max-width:500px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,.28)}
    .dialog h2{font-size:18px;margin-bottom:8px}
    .dialog p{font-size:13px;color:#555;line-height:1.55;margin-bottom:12px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:3px}
    input[type=text]{width:100%;padding:7px 10px;font-size:13px;border:1px solid #ccc;border-radius:4px;background:#fff;box-sizing:border-box}
    .btn{background:#3388ff;color:#fff;border:none;border-radius:4px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
    .btn:hover{background:#2266cc}
    code{background:#f5f5f5;padding:2px 5px;border-radius:3px;font-size:12px}
    #provider-badge{position:fixed;bottom:10px;left:10px;z-index:9999;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 9px;border-radius:4px;pointer-events:none}
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2>Leaflet.AI.GeoJSON &mdash; Local Demo</h2>
      <p>This demo requires a running local proxy that holds your API key. Start it with:</p>
      <p><code>npm run proxy</code> &nbsp;&mdash;&nbsp; then open this page at <code>http://localhost:3000</code></p>
      <p>The proxy runs on port 3000 by default. Set your Gemini or OpenRouter key in <code>examples/proxy-node/.env</code> before starting.</p>
      <div class="field">
        <label>Proxy URL</label>
        <input type="text" id="proxyUrl" value="http://localhost:3000/llm" autocomplete="off" />
      </div>
      <div class="field">
        <label>Model list URL (optional &mdash; enables model picker)</label>
        <input type="text" id="modelListUrl" value="http://localhost:3000/models" autocomplete="off" />
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="modelInput" value="gemini-2.0-flash" autocomplete="off" />
      </div>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="provider-badge"></div>
  <script>
  (function(){
    var overlay=document.getElementById("overlay");
    var badge=document.getElementById("provider-badge");
    document.getElementById("startBtn").addEventListener("click",function(){
      var proxyUrl=document.getElementById("proxyUrl").value.trim();
      var modelListUrl=document.getElementById("modelListUrl").value.trim();
      var model=document.getElementById("modelInput").value.trim();
      if(!proxyUrl)return;
      overlay.style.display="none";
      var map=L.map("map").setView([20,0],2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        attribution:"&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors",maxZoom:19
      }).addTo(map);
      var cfg={proxyUrl:proxyUrl,model:model,modelPicker:!!modelListUrl,settingsPanel:true};
      if(modelListUrl)cfg.modelListUrl=modelListUrl;
      L.control.aiGeojson(cfg).addTo(map);
      badge.textContent="Proxy: "+proxyUrl+" \u2014 "+model;
    });
  })();
  </script>
</body>
</html>
