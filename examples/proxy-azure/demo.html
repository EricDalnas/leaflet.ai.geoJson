<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet.AI.GeoJSON — Proxy Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="../../src/leaflet.ai.geojson.css" />
  <script src="../../src/leaflet.ai.geojson.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    L.control.aiGeojson({
      proxyUrl:      'https://leafletaigeojson-bmh4czbdgefxd7e3.canadaeast-01.azurewebsites.net/api/llm',
      model:         'gemini-flash-latest',
      modelPicker:   true,
      modelListUrl:  'https://leafletaigeojson-bmh4czbdgefxd7e3.canadaeast-01.azurewebsites.net/api/models',
      settingsPanel: true
    }).addTo(map);
  </script>
</body>
</html>
